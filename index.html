<!DOCTYPE html>
<html lang="en" class="theme-warmorange-normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Clock Listening Trainer</title>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon_CLT_16x16.png" />
    <script src="src/js/theme-boot.js"></script>
    <script type="module" src="src/js/main.js"></script>
    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <!-- CLT -->
  <body>
    <!-- Line icons. Colour comes from CSS (currentColor). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="6.5" r="1.6" fill="currentColor" stroke="none" />
        <path d="M12 10.5v8" />
      </symbol>

      <symbol id="i-mode-contrast" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
      </symbol>

      <symbol id="i-mode-normal" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </symbol>

      <symbol id="i-mode-evening" viewBox="0 0 24 24">
        <path d="M8 17a4 4 0 0 1 8 0" />
        <path d="M2 17h20M7 20.5h10M12 7v2M4.9 9.9l1.4 1.4M17.7 11.3l1.4-1.4" />
      </symbol>

      <symbol id="i-mode-night" viewBox="0 0 24 24">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      </symbol>

      <symbol id="i-reset" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
      </symbol>

      <symbol id="i-gear" viewBox="0 0 24 24">
        <path d="M10.31 5.21L10.68 2.59L13.32 2.59L13.69 5.21L17.04 7.14L19.49 6.15L20.81 8.44L18.73 10.07L18.73 13.93L20.81 15.56L19.49 17.85L17.04 16.86L13.69 18.79L13.32 21.41L10.68 21.41L10.31 18.79L6.96 16.86L4.51 17.85L3.19 15.56L5.27 13.93L5.27 10.07L3.19 8.44L4.51 6.15L6.96 7.14L10.31 5.21Z" />
        <circle cx="12" cy="12" r="2.8" />
      </symbol>
    </svg>

    <div class="scroll-container" id="scrollContainer">
      <div class="layout">
        <div class="titles-container" id="titlesContainer">
          <img class="title-icon" id="titleIcon" src="assets/icons/icon_CLT_64x64.png" alt="Icon" />
          <div class="title-text" id="titleText">
            <h2>Clock Listening Trainer<br /></h2>
            <h6 id="version" class="version"></h6>
          </div>
        </div>
        <h5>
          <a class="author-link" href="mailto:Oleksii.Pokormiakho.job@gmail.com"> Oleksii Pokormiakho </a>
        </h5>

        <div class="setting-row" id="settingsRow">
          <div class="setting-buttons">
            <button type="button" class="help-app-btn" id="helpAppBtn" title="Open application description" aria-label="Open application description">
              <span class="framed-icon">
                <svg aria-hidden="true"><use href="#i-info" /></svg>
              </span>
            </button>

            <button type="button" class="settings-app-btn" id="settingsAppBtn" title="Settings" aria-label="Settings">
              <span class="framed-icon">
                <svg aria-hidden="true"><use href="#i-gear" /></svg>
              </span>
            </button>
          </div>

          <button type="button" class="mode-app-btn" id="themaModeBtn" title="Mode" aria-label="Mode">
            <span class="mode-icon" id="themaModeIcon"></span>
          </button>
        </div>

        <div class="section-row">
          <!-- The rows with the times are made by the code (the number is "rows" in config/config.json) -->
          <div class="section-block section-block-exercises" id="clockRows"></div>

          <div class="setting-button-wrapper">
            <div class="section-block section-block-buttons">
              <button class="fill-random-btn" id="fillRandomBtn" data-i18n="fillRandomBtn" data-i18n-title="fillRandomBtnTitle">RND</button>
              <button class="start-pause-btn" id="startPauseBtn" data-i18n="btnStart" data-i18n-title="startPauseBtnTitle">Start</button>
              <button disabled class="reset-btn" id="resetBtn" data-i18n="resetBtn" data-i18n-title="resetBtnTitle">Reset</button>
            </div>

            <div class="section-block section-block-settings">
              <div class="speed-delay-wrapper">
                <div class="speed-group">
                  <label for="speedSelect" id="labelSpeed" data-i18n="labelSpeed">Speed</label>
                  <select id="speedSelect" class="speed-select">
                    <option value="0.6">0.6</option>
                    <option value="0.8">0.8</option>
                    <option value="1.0" selected>1.0</option>
                    <option value="1.2">1.2</option>
                    <option value="1.4">1.4</option>
                    <option value="1.6">1.6</option>
                    <option value="1.8">1.8</option>
                    <option value="2.0">2.0</option>
                  </select>
                </div>
                <div class="interval-group">
                  <label for="intervalSelect" class="label-interval" id="labelInterval" data-i18n="labelInterval">Interval (ms)</label>
                  <select id="intervalSelect" class="interval-select">
                    <option value="1000" selected>1000</option>
                    <option value="1500">1500</option>
                    <option value="2000">2000</option>
                    <option value="2500">2500</option>
                    <option value="3000">3000</option>
                    <option value="4000">4000</option>
                    <option value="5000">5000</option>
                    <option value="6000">6000</option>
                    <option value="7000">7000</option>
                    <option value="8000">8000</option>
                    <option value="9000">9000</option>
                    <option value="10000">10000</option>
                  </select>
                </div>
              </div>
              <div class="language-voice-wrapper">
                <div class="language-group">
                  <label for="languageCodeSelect" class="label-language-code" id="labelLanguageCode" data-i18n="labelLanguageCode">Language</label>
                  <select class="language-code-select" id="languageCodeSelect" title="Language"></select>
                </div>
                <div class="voice-group">
                  <label for="voiceSelect" class="label-voice" id="labelVoice" data-i18n="labelVoice">Voice</label>
                  <select class="voice-select" id="voiceSelect" title="Voice"></select>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="developer" id="developer">
          <button type="button" id="developerPathBtn" title="Path to this page">Path</button>
          <button type="button" id="developerClearBtn" title="Clear the saved settings of this app">Clear LS</button>
        </div>
      </div>
    </div>

    <div id="settingsAppModal" class="app-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="app-modal-content">
        <div class="app-modal-header">
          <h2 class="app-modal-title" id="settingsTitle" data-app="CLT">Application settings</h2>
          <button type="button" id="settingsAppCloseBtn" class="app-modal-close-btn" title="Close" aria-label="Close">✕</button>
        </div>

        <div class="app-modal-body-wrap">
          <div class="step-badge step-badge-settings" id="stepBadgeSettings" aria-hidden="true"></div>
          <div class="scroll-hint scroll-hint-left" id="scrollHintLeft" aria-hidden="true"><span class="hint-up"></span><span class="hint-down"></span></div>
          <div class="scroll-hint scroll-hint-right" id="scrollHintRight" aria-hidden="true"><span class="hint-up"></span><span class="hint-down"></span></div>
          <div class="app-modal-body" id="settingsBody">
            <div id="settingsAppContent" class="settings-app-content">
              <div class="speed-delay-wrapper">
                <div class="speed-group">
                  <label for="speedSelectCopy" id="labelSpeedCopy" data-mirror-of="labelSpeed">Speed</label>
                  <select id="speedSelectCopy" data-mirror-of="speedSelect"></select>
                </div>
                <div class="interval-group">
                  <label for="intervalSelectCopy" id="labelIntervalCopy" data-mirror-of="labelInterval">Interval (ms)</label>
                  <select id="intervalSelectCopy" data-mirror-of="intervalSelect"></select>
                </div>
              </div>
              <div class="rows-wrapper">
                <div class="rows-group">
                  <label for="rowsSelect" id="labelRows" class="label-rows" data-i18n="labelRows">Rows</label>
                  <select id="rowsSelect" class="rows-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                  </select>
                </div>
              </div>
              <div class="language-voice-wrapper">
                <div class="language-group">
                  <label for="languageCodeSelectCopy" id="labelLanguageCodeCopy" data-mirror-of="labelLanguageCode">Language</label>
                  <select id="languageCodeSelectCopy" data-mirror-of="languageCodeSelect"></select>
                </div>
                <div class="voice-group">
                  <label for="voiceSelectCopy" id="labelVoiceCopy" data-mirror-of="labelVoice">Voice</label>
                  <select id="voiceSelectCopy" data-mirror-of="voiceSelect"></select>
                </div>
              </div>
              <div class="interface-wrapper">
                <div class="interface-group" id="uiLanguageWrapper">
                  <label for="uiLangSelect" class="label-interface" id="uiLangLabel" data-i18n="uiLangLabel">Interface:</label>
                  <select class="interface-select" id="uiLangSelect" data-i18n-title="uiLangSelectTitle" title="Select interface language">
                    <option value="ar">العربية</option>
                    <option value="cs">Čeština</option>
                    <option value="de">Deutsch</option>
                    <option value="en" selected>English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="nl">Nederlands</option>
                    <option value="pl">Polski</option>
                    <option value="pt">Português</option>
                    <option value="ru">Русский</option>
                    <option value="tr">Türkçe</option>
                    <option value="uk">Українська</option>
                  </select>
                </div>
                <div class="thema-group" id="themaGroup">
                  <label for="themaSelect" id="labelThema" class="label-thema" data-i18n="labelThema">Theme</label>
                  <select id="themaSelect" class="thema-select"></select>
                </div>
                <div class="thema-group" id="themaModeGroup">
                  <label for="themaModeSelect" id="labelThemaMode" class="label-thema" data-i18n="labelThemaMode">Mode</label>
                  <select id="themaModeSelect" class="thema-select" title="Select theme mode">
                    <option value="contrast">Contrast</option>
                    <option value="normal" selected>Normal</option>
                    <option value="evening">Evening</option>
                    <option value="night">Night</option>
                  </select>
                </div>
              </div>
              <div class="reset-settings-group" id="resetSettingsGroup">
                <button type="button" class="reset-settings-btn" id="resetSettingsBtn" data-i18n-title="resetSettingsTitle" title="Reset to default settings">
                  <svg class="ico" aria-hidden="true"><use href="#i-reset" /></svg>
                </button>
                <span class="reset-settings-text" id="resetSettingsText" data-i18n="defaultSettings">Reset defaults</span>
              </div>
            </div>
            <div class="snap-spacer" id="settingsSnapSpacer" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="helpAppModal" class="app-modal hidden" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <div class="app-modal-content">
        <div class="app-modal-header">
          <h2 class="app-modal-title" id="helpTitle" data-app="CLT">Information</h2>
          <button type="button" id="helpAppCloseBtn" class="app-modal-close-btn" title="Close" aria-label="Close">✕</button>
        </div>

        <div class="app-modal-body help-body" id="helpBody">
          <div id="helpAppContent"></div>
        </div>
      </div>
    </div>
  </body>
</html>
